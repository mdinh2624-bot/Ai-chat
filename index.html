
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rose AI</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, sans-serif;
    background: #101116;
    color: white;
    height: 100vh;
    display: flex;
}

.sidebar {
    width: 250px;
    background: #191a22;
    padding: 20px;
    display: flex;
    flex-direction: column;
}

.logo {
    font-size: 25px;
    font-weight: bold;
    color: #c6a4ff;
    margin-bottom: 30px;
}

.new-chat {
    background: #30313b;
    color: white;
    border: none;
    padding: 13px;
    border-radius: 12px;
    cursor: pointer;
    text-align: left;
}

.new-chat:hover {
    background: #41424f;
}

.sidebar p {
    color: #999;
    margin-top: auto;
    font-size: 12px;
}

.main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

.header {
    padding: 20px;
    border-bottom: 1px solid #292a32;
    font-size: 18px;
    font-weight: bold;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 25px;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

.welcome {
    margin: auto;
    text-align: center;
}

.welcome h1 {
    font-size: 36px;
    background: linear-gradient(90deg,#a78bfa,#60a5fa);
    color: transparent;
    background-clip: text;
    margin-bottom: 12px;
}

.welcome p {
    color: #aaa;
}

.message {
    max-width: 80%;
    padding: 14px 17px;
    border-radius: 16px;
    line-height: 1.6;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
}

.user {
    background: #373849;
    align-self: flex-end;
}

.ai {
    background: #20212a;
    align-self: flex-start;
}

.input-area {
    padding: 18px;
    display: flex;
    gap: 10px;
    max-width: 900px;
    width: 100%;
    margin: auto;
}

.input-area input {
    flex: 1;
    padding: 16px;
    border: 1px solid #383944;
    border-radius: 15px;
    background: #20212a;
    color: white;
    outline: none;
    min-width: 0;
}

.input-area button {
    padding: 0 22px;
    border: none;
    border-radius: 15px;
    background: #a78bfa;
    color: #17131f;
    font-weight: bold;
    cursor: pointer;
}

.input-area button:hover {
    background: #c4b5fd;
}

@media(max-width:650px) {
    .sidebar {
        display: none;
    }

    .chat {
        padding: 15px;
    }

    .message {
        max-width: 92%;
    }

    .welcome h1 {
        font-size: 29px;
    }
}
</style>
</head>

<body>

<aside class="sidebar">
    <div class="logo">🌸 Rose AI</div>
    <button class="new-chat" onclick="newChat()">
        ＋ Cuộc trò chuyện mới
    </button>
    <p>Rose AI · Personal Assistant</p>
</aside>

<main class="main">
    <header class="header">Rose AI ✨</header>

    <section class="chat" id="chat">
        <div class="welcome" id="welcome">
            <h1>Xin chào! 👋</h1>
            <p>Tôi có thể giúp gì cho bạn hôm nay?</p>
        </div>
    </section>

    <form class="input-area" id="chatForm">
        <input
            id="prompt"
            type="text"
            placeholder="Nhập câu hỏi của bạn..."
            autocomplete="off"
            required
        >
        <button type="submit">Gửi ➤</button>
    </form>
</main>

<script>
const chat = document.getElementById("chat");
const input = document.getElementById("prompt");
const form = document.getElementById("chatForm");

function addMessage(text, type) {
    const message = document.createElement("div");
    message.className = "message " + type;
    message.textContent = text;
    chat.appendChild(message);
    chat.scrollTop = chat.scrollHeight;
}

async function sendMessage(text) {
    if (!text.trim()) return;

    const welcome = document.getElementById("welcome");
    if (welcome) welcome.remove();

    addMessage(text, "user");
    input.value = "";

    const loading = document.createElement("div");
    loading.className = "message ai";
    loading.textContent = "Rose AI đang suy nghĩ...";
    chat.appendChild(loading);

    try {
        // Backend AI cần được triển khai tại địa chỉ này.
        const response = await fetch("/api/chat", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                message: text
            })
        });

        if (!response.ok) {
            throw new Error("Máy chủ AI chưa sẵn sàng.");
        }

        const data = await response.json();
        loading.textContent = data.reply || "AI chưa có câu trả lời.";

    } catch (error) {
        loading.textContent =
            "⚠️ Chưa kết nối được AI. Bạn cần triển khai backend và cấu hình API trước.";
    }

    chat.scrollTop = chat.scrollHeight;
}

form.addEventListener("submit", function(event) {
    event.preventDefault();
    sendMessage(input.value);
});

function newChat() {
    chat.innerHTML = `
        <div class="welcome" id="welcome">
            <h1>Xin chào! 👋</h1>
            <p>Tôi có thể giúp gì cho bạn hôm nay?</p>
        </div>
    `;
}
</script>

</body>
</html>
